# Render 배포 설계도(Blueprint) — 서버 1개 + PostgreSQL 1개를 한 번에 만든다.
# 무료(free) 요금제 제한: 15분 무접속 시 잠듦(깨우는 데 약 1분), DB는 30일 후 만료, 첨부파일은 재배포 때 사라짐.
# 시연·시범 운영 전에는 Render 화면에서 서버·DB 요금제를 유료로 바꾼다.
services:
  - type: web
    name: happydorm
    runtime: docker
    plan: free
    region: singapore            # 한국에서 가장 가까운 지역
    healthCheckPath: /health
    autoDeploy: true             # GitHub main에 push하면 자동으로 다시 배포
    envVars:
      - key: APP_ENV
        value: production        # 운영 보안 점검을 켠다(약한 키·잘못된 설정이면 서버가 뜨지 않음)
      - key: DATABASE_URL
        fromDatabase:
          name: happydorm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true      # 로그인 토큰용 비밀키 — Render가 무작위로 만든다
      - key: DATA_ENCRYPTION_KEY
        generateValue: true      # 계좌번호 등 암호화 키(32바이트) — Render가 무작위로 만든다. 절대 바꾸지 말 것
      - key: PDF_ENGINE
        value: builtin           # 공문 PDF를 LibreOffice 없이 내장 방식으로(무료 서버의 작은 메모리·CPU에서도 빠르고 안정적)
      - key: SEED_DEMO
        value: "1"               # DB가 비어 있을 때만 데모 데이터를 만든다
      - key: KASI_SERVICE_KEY
        sync: false              # 공휴일 서비스키 — 처음 만들 때 화면에서 입력(비워 둬도 됨)

databases:
  - name: happydorm-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: dormitory_loan
    user: dormuser
    ipAllowList: []              # 외부 인터넷에서 DB 직접 접속 차단(서버만 내부망으로 접속)
